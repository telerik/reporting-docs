name: Check Folder Landings

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-folder-landings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that documentation folders have a landing
        run: node .github/scripts/check-folder-landings.mjs

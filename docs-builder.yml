  kendothemeversion: "14.5.0"
  blazoruiversion: "14.0.0"
  jqueryversion: "3.7.1"
  mindotnetversion: "8"
  mindotnetoutputdir: "\\bin\\Debug\\net8.0"
  dotnetversions: ".NET 8, .NET 9, .NET 10, and .NET 11 Preview 4"


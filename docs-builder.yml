top-navigation-product: reporting
path-prefix: /products/reporting/documentation
product-id: 521
product-name: Telerik Reporting
product-url: https://www.telerik.com/products/reporting
product-code: REPORTING
product-trial-url: https://www.telerik.com/try/reporting
contribute-url: https://github.com/telerik/reporting-docs/edit/master

search-engine-id: 001595215763381649090:zzabynuukmu
search-provider: nuclia
gitLastCommitDateEnabled: true

cta-overview: "@ProductLink is a complete .NET embedded reporting tool for web and desktop applications. To try it out, sign up for a free 30-day trial."
cta-intro: "@ProductLink is a complete .NET embedded reporting tool for web and desktop applications. To try it out, sign up for a free 30-day trial."
default-title-prefix: Telerik Reporting

# images
avatar-path: ./images/avatar-ninja.svg
no-results-image-path: ./images/ninja-no-results.svg
pdf-cover-png-path: ./images/pdf-cover.png
code-snippets-basePath: ../reporting
img-max-width: 80%

# tables and colors
primary-color:
  light: "#D04500"
  dark: "#FF6F00"
enable-tabbed-code-blocks: true
table-layout: fixed

# regex replacements for markdown files
markdown-replacements:
  - pattern: \[(?:`?(.*?)`?)\]\(\/reporting\/api\/([^)]+)\)
    replacement: "[$1](/api/$2)"
  - pattern: \[(?:`?(.*?)`?)\]\(\/api\/([^)]+)\)
    replacement: "[$1](slug:$2)"
  # removing code snippets on build until the replacement tool is ready
  # - pattern: \{\{source=.*?\}\}
  #   replacement: "code snippets"
  ## API REF REPLACEMENT
  ##  pointing (/api) links to the live api reference
  # - pattern: \[(?:`?(.*?)`?)\]\(\/api\/([^)]+)\)
  #   replacement: "[$1](https://www.telerik.com/products/reporting/documentation/api/$2)"

